<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FollowApp</title>
  <style>
    :root {
      --ground: #0E161C;
      --surface: #16212A;
      --surface-2: #1C2933;
      --rule: #2C3B45;
      --rule-soft: #223038;
      --ink: #E8EFF3;
      --ink-soft: #B9CAD4;
      --muted: #7D919D;
      --accent: #4FC7D1;
      --ok: #6FBE8C;
      --bad: #E0736C;
      --unk: #D6A550;
      --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;

      /* Los desplegables los pinta el sistema: sin esto salen en blanco. */
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    /* Sin esto el fondo de body se propaga al lienzo y tapa las esquinas. */
    html { background: transparent; }

    /* Cabecera y pie fijos; solo el listado hace scroll. */
    body {
      width: 400px;
      min-height: 240px;
      max-height: 560px;
      margin: 0;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      background: var(--ground);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 13.5px;
      line-height: 1.5;
    }

    header, nav, .bar, footer, .diag { flex: 0 0 auto; }

    main {
      flex: 1 1 auto; overflow-y: auto; min-height: 0;
      /* Reserva el hueco: el listado no se desplaza al aparecer la barra. */
      scrollbar-gutter: stable;
    }

    /* Barra de scroll a juego con el tema; la de Chrome desentona en oscuro. */
    main::-webkit-scrollbar { width: 10px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb {
      background: var(--rule);
      border-radius: 5px;
      /* El borde transparente adelgaza el pulgar sin estrechar el area de agarre. */
      border: 3px solid var(--ground);
      background-clip: padding-box;
    }
    main::-webkit-scrollbar-thumb:hover { background: #3C5060; background-clip: padding-box; }
    main::-webkit-scrollbar-thumb:active { background: var(--accent); background-clip: padding-box; }

    /* Navegadores sin el pseudo-elemento de WebKit. */
    @supports not selector(::-webkit-scrollbar) {
      main { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
    }

    /* Pegado arriba del listado: se ve aunque estes a mitad de scroll. */
    .loading {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: var(--surface); border-bottom: 1px solid var(--rule);
      font-size: 12px; color: var(--accent);
    }
    .loading .spin {
      width: 11px; height: 11px; flex: 0 0 auto;
      border: 2px solid var(--rule); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading .n { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      .spin { animation: none; }
      .status .dot { animation: none; }
    }

    /* ---------------- cabecera ---------------- */

    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--rule);
    }

    .brand { flex: 1; min-width: 0; }
    .brand h1 {
      font-size: 14px; font-weight: 600; margin: 0;
      letter-spacing: -0.01em; cursor: default; user-select: none;
    }
    .brand .handle {
      font-family: var(--mono); font-size: 11px; color: var(--muted);
      display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .counts { display: flex; gap: 14px; text-align: right; }
    .counts div { min-width: 46px; }
    .counts b {
      display: block; font-family: var(--mono); font-size: 16px;
      font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15;
    }
    .counts span { font-size: 9.5px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }

    /* ---------------- pestañas ---------------- */

    nav { display: flex; border-bottom: 1px solid var(--rule); padding: 0 8px; }
    .tab {
      background: none; border: 0; border-bottom: 2px solid transparent;
      padding: 9px 10px; margin-bottom: -1px; cursor: pointer;
      font-family: var(--sans); font-size: 12.5px; font-weight: 500;
      color: var(--muted);
    }
    .tab:hover:not(.active) { color: var(--ink); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab .n {
      font-family: var(--mono); font-size: 10px; margin-left: 5px;
      background: var(--surface-2); color: var(--ink-soft);
      padding: 1px 5px; border-radius: 8px;
    }
    .tab.active .n { background: var(--accent); color: #06222A; }

    .pane { padding: 4px 0 8px; }
    [hidden] { display: none !important; }

    /* ---------------- gente ---------------- */

    .day {
      font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--muted); padding: 10px 16px 4px;
    }

    .person {
      display: grid; grid-template-columns: 32px 1fr auto;
      gap: 10px; align-items: center;
      padding: 7px 16px;
    }
    .person + .person { border-top: 1px solid var(--rule-soft); }

    .av {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--surface-2) center/cover no-repeat;
      display: grid; place-items: center;
      font-family: var(--mono); font-size: 10px; font-weight: 700;
      color: var(--muted);
    }
    .av.loaded { color: transparent; }

    .who { min-width: 0; }
    .who .u {
      font-size: 13px; font-weight: 500; display: block;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    a.u { text-decoration: none; color: var(--ink); }
    a.u:hover, a.u:focus-visible { color: var(--accent); text-decoration: underline; }
    .who .n {
      font-size: 11px; color: var(--muted); display: block;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .what { font-size: 10.5px; text-align: right; white-space: nowrap; }
    .what b { display: block; font-weight: 600; }
    .what .t { color: var(--muted); font-size: 9.5px; }
    .out b { color: var(--bad); }
    .in  b { color: var(--ok); }
    /* Ni una cuenta borrada ni una racha son bajas: el rojo es solo para esas. */
    .gone b { color: var(--muted); }
    .cycle b { color: var(--unk); }
    .what .q { display: block; color: var(--muted); font-size: 9px; font-style: italic; }

    /* ---------------- estados ---------------- */

    .empty { padding: 28px 22px; text-align: center; color: var(--muted); font-size: 12.5px; }
    .empty strong { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 5px; font-weight: 600; }

    /* Primera apertura: sin esto la extension se queda apagada para siempre. */
    .welcome { padding: 26px 22px 22px; text-align: center; }
    .welcome strong { display: block; color: var(--ink); font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .welcome p { margin: 0 0 16px; color: var(--ink-soft); font-size: 12.5px; line-height: 1.55; }
    .welcome .fine { margin: 14px 0 0; color: var(--muted); font-size: 11px; }
    .welcome button { padding: 9px 20px; font-size: 13px; }

    /* Aviso de hueco: informa sin alarmar, que no es un error. */
    .gap {
      margin: 0; padding: 7px 16px;
      border-left: 2px solid var(--rule);
      background: var(--surface); color: var(--muted);
      font-size: 11px; line-height: 1.4;
    }

    .notice {
      margin: 10px 16px; padding: 9px 11px; border-radius: 4px;
      background: #33280F; color: var(--unk); font-size: 12px;
    }

    /* El diagnostico sale solo cuando hace falta: quien mas lo necesita es
       justo quien no va a buscarlo detras de tres clics. */
    .alert {
      margin: 10px 16px 2px; padding: 10px 12px; border-radius: 4px;
      background: #33280F; border: 1px solid #4A3A16;
    }
    .alert p { margin: 0 0 5px; color: var(--unk); font-size: 12px; line-height: 1.45; }
    .alert .hint { margin: 0 0 9px; color: var(--muted); font-size: 10.5px; line-height: 1.4; }
    .alert button {
      background: none; border: 1px solid var(--unk); border-radius: 3px;
      color: var(--unk); font-family: var(--sans); font-size: 11px; font-weight: 600;
      padding: 4px 10px; cursor: pointer;
    }
    .alert button:hover { background: var(--unk); color: #33280F; }
    

    /* ---------------- pie ---------------- */

    footer {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 16px; border-top: 1px solid var(--rule);
      background: var(--surface);
    }

    .status {
      flex: 1; min-width: 0; font-size: 11px; color: var(--muted);
      /* Un mensaje largo se recorta; "en 44 s" no se parte en dos lineas. */
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status .dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); margin-right: 6px; vertical-align: middle;
    }
    .status.on .dot { background: var(--ok); }
    /* Apagada con historial detras: es un aviso, no un estado neutro. */
    .status.off { color: var(--unk); }
    .status.off .dot { background: var(--unk); }
    .status.run .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.25; } }

    .switch { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); cursor: pointer; }
    .switch input { accent-color: var(--accent); width: 13px; height: 13px; margin: 0; }

    /* Selector de idioma: discreto, pero a la vista y no escondido. */
    #lang {
      background: var(--ground); border: 1px solid var(--rule); border-radius: 4px;
      color: var(--muted); font-family: var(--mono); font-size: 10.5px;
      padding: 4px 3px; cursor: pointer;
    }
    #lang:hover { color: var(--ink); border-color: var(--muted); }
    #lang option { background: var(--surface); color: var(--ink); }

    .go {
      background: var(--accent); color: #06222A; border: 0; border-radius: 4px;
      padding: 6px 12px; font-family: var(--sans); font-size: 12px; font-weight: 600;
      cursor: pointer;
    }
    .go:hover:not(:disabled) { filter: brightness(1.1); }
    .go:disabled { opacity: 0.45; cursor: default; }

    button:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Barra de progreso fina en el pie: informa sin explicar nada. */
    .bar { height: 2px; background: var(--rule); }
    .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }

    /* ---------------- diagnóstico oculto ---------------- */

    .diag { border-top: 1px solid var(--rule); background: var(--surface); padding: 10px 16px; }
    .diag dl {
      display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
      font-family: var(--mono); font-size: 10.5px; margin: 0 0 8px;
    }
    .diag dt { color: var(--muted); }
    .diag dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-word; }
    .diag select {
      background: var(--ground); color: var(--ink); border: 1px solid var(--rule);
      border-radius: 3px; font-family: var(--mono); font-size: 10.5px; padding: 2px 4px;
    }
    .diag .log { border-top: 1px solid var(--rule-soft); padding-top: 6px; margin-top: 6px; }
    .logline {
      display: grid; grid-template-columns: 58px 1fr; gap: 8px;
      font-family: var(--mono); font-size: 9.5px; line-height: 1.45; color: var(--ink-soft);
    }
    .logline .t { color: var(--muted); }
    .l-warn { color: var(--unk); }
    .l-bad  { color: var(--bad); }
    .diag .row { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--muted); }
    .diag .row button {
      background: none; border: 1px solid var(--rule); border-radius: 3px;
      color: var(--muted); font-size: 10.5px; padding: 3px 8px; cursor: pointer;
    }
    .diag .row button:hover { color: var(--bad); border-color: var(--bad); }
    .diag .row button.copy:hover { color: var(--accent); border-color: var(--accent); }
    .diag .fine { margin: 6px 0 0; color: var(--muted); font-size: 9.5px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1 id="brand">FollowApp</h1>
      <span class="handle" id="handle">—</span>
    </div>
    <div class="counts">
      <div><b id="nfollowers">—</b><span id="l-followers">seguidores</span></div>
      <div><b id="nfollowing">—</b><span id="l-following">seguidos</span></div>
    </div>
  </header>

  <nav role="tablist">
    <button class="tab active" type="button" data-tab="actividad" role="tab" aria-selected="true">
      <span id="l-tab-act">Actividad</span><span class="n" id="n-act" hidden></span>
    </button>
    <button class="tab" type="button" data-tab="sincorresponder" role="tab" aria-selected="false">
      <span id="l-tab-nfb">No te siguen</span><span class="n" id="n-nfb" hidden></span>
    </button>
  </nav>

  <main>
    <div class="loading" id="loading" hidden>
      <span class="spin"></span>
      <span id="loading-text"></span>
      <span class="n" id="loading-n"></span>
    </div>
    <div class="alert" id="alert" hidden>
      <p id="alert-text"></p>
      <p class="hint" id="alert-hint"></p>
      <button type="button" id="alert-copy"></button>
    </div>
    <div class="pane" id="actividad" role="tabpanel"></div>
    <div class="pane" id="sincorresponder" role="tabpanel" hidden></div>
  </main>

  <div class="bar"><i id="pbar"></i></div>

  <footer>
    <span class="status" id="status"><span class="dot"></span><span id="status-text">Cargando…</span></span>
    <select id="lang" aria-label="Idioma"></select>
    <label class="switch"><input type="checkbox" id="watch"> <span id="l-auto">Automático</span></label>
    <button class="go" id="go" type="button">Revisar</button>
  </footer>

  <div class="diag" id="diag" hidden></div>

  <script type="module" src="./popup/popup.ts"></script>
</body>
</html>
